<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000b1e" />
    <meta name="description" content="The Mybitstore web app: your balance, assets, recent activity and live token prices in one place." />
    <meta name="robots" content="noindex" />
    <script>(function(){try{var q=new URLSearchParams(location.search).get("theme");var t=q==="light"||q==="dark"?q:localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t="dark";document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#060c1b":"#ffffff"}catch(e){}})()</script>
    <title>Web App · Mybitstore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web-app/main.jsx"></script>
  </body>
</html>
